<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reports" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1e3a4c" />
  <title>Daily reports 2026–2027</title>
  <style>
    :root {
      --navy: #1e3a4c;
      --teal: #0f766e;
      --ink: #1c1917;
      --muted: #57534e;
      --empty: #faf8f5;
      --weekend: #e8e4dc;
      --invalid: #d6d3d1;
      --cream: #f7f3ec;
      --note: #0f766e;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      background: #efeae2;
      color: var(--ink);
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 14px 14px 10px;
      padding-top: max(14px, env(safe-area-inset-top));
    }
    header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
    header p { margin: 0; opacity: .85; font-size: 13px; }
    .switch {
      display: flex; gap: 8px; margin-top: 10px;
    }
    .switch a {
      color: #fff; text-decoration: none; font-weight: 700; font-size: 13px;
      padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.35);
    }
    .switch a.on { background: #fff; color: var(--navy); }
    .bar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 8px 12px; background: #fff; border-bottom: 1px solid #e7e5e4;
    }
    .chip { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .sq {
      width: 26px; height: 26px; border-radius: 5px; background: var(--note);
      color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 12px;
    }
    .periods { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px 0; }
    .periods button {
      border: 1px solid #d6d3d1; background: #fff; color: var(--navy);
      padding: 12px 8px; border-radius: 8px; min-height: 44px; flex: 1 1 46%;
      font: 600 15px/1.3 -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer;
    }
    .periods button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
    .phone { padding: 12px 12px 28px; }
    .phone-month {
      background: #fff; border-radius: 14px; margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: hidden;
    }
    .phone-head { padding: 12px 14px 8px; background: var(--cream); }
    .m-name { font-weight: 700; font-size: 17px; color: var(--navy); }
    .m-hours { font-weight: 700; font-size: 16px; margin-top: 2px; }
    .m-hours span { font-size: 13px; font-weight: 600; color: var(--muted); }
    .phone-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 8px 8px 12px;
    }
    .wd {
      text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 2px 0;
    }
    .wd.weekend { color: #c2410c; }
    .day {
      width: auto; min-width: 0; height: 56px; min-height: 56px;
      border-radius: 10px; border: 1px solid #e7e5e4; background: var(--empty);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 800; cursor: pointer; user-select: none; line-height: 1.05; gap: 1px;
    }
    .day.weekend { background: var(--weekend); }
    .day.has { background: var(--note); color: #fff; border-color: var(--note); }
    .day .n { font-size: 14px; }
    .day .st { font-size: 11px; }
    .day.empty { background: transparent; border: 0; cursor: default; }
    .thumbs {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 0;
    }
    .thumbs .p { position: relative; aspect-ratio: 1; }
    .thumbs img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; background: #eee; }
    .thumbs .x {
      position: absolute; top: 4px; right: 4px; width: 28px; height: 28px;
      border: 0; border-radius: 50%; background: #fff; color: var(--navy);
      font-weight: 800; cursor: pointer;
    }
    .add-photo {
      display: block; margin-top: 10px; text-align: center;
      border: 1px dashed #d6d3d1; border-radius: 8px; padding: 12px;
      font-weight: 700; color: var(--navy); cursor: pointer;
    }
    .summary { padding: 0 12px 16px; color: var(--muted); font-size: 15px; }
    .summary b { color: var(--navy); }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px 8px; }
    .tools button, .tools label {
      border: 1px solid #d6d3d1; background: #fff; color: var(--navy);
      padding: 10px 14px; border-radius: 8px; min-height: 44px; flex: 1 1 40%;
      font: 600 14px/1.3 -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer; text-align: center;
    }
    .sync-box {
      display: block; width: calc(100% - 24px); margin: 0 12px 8px;
      min-height: 88px; padding: 10px 12px; border: 1px solid #d6d3d1;
      border-radius: 8px; font: 13px ui-monospace, Menlo, monospace;
      resize: vertical; background: #fff;
    }
    .sync-msg { padding: 0 12px 28px; font-size: 14px; color: var(--teal); font-weight: 600; }
    .editor {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: #fff; border-top: 2px solid var(--navy);
      padding: 14px 14px calc(16px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 24px rgba(0,0,0,.12);
      max-height: 92vh; overflow: auto;
    }
    .editor[hidden] { display: none; }
    .editor h2 { margin: 0 0 8px; font-size: 18px; color: var(--navy); }
    .editor textarea {
      width: 100%; min-height: 140px; padding: 10px 12px;
      border: 1px solid #d6d3d1; border-radius: 8px;
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      resize: vertical;
    }
    .editor .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .editor button {
      flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid #d6d3d1;
      background: #fff; color: var(--navy); font: 700 15px -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer;
    }
    .editor #edSave { background: var(--navy); color: #fff; border-color: var(--navy); }
    @media (min-width: 821px) and (hover: hover) and (pointer: fine) {
      header { padding: 16px 24px 12px; }
      header h1 { font-size: 24px; }
      header p { font-size: 15px; }
      .periods { padding: 14px 20px 0; }
      .periods button { flex: 0 0 auto; padding: 10px 16px; min-height: 0; }
      .phone { padding: 14px 20px 36px; }
      .tools { padding: 0 20px 8px; }
      .tools button, .tools label { min-height: 0; flex: 0 0 auto; }
      .sync-box { width: calc(100% - 40px); margin: 0 20px 8px; }
      .sync-msg { padding: 0 20px 24px; }
      .summary { padding: 0 20px 16px; }
      .editor { left: 20%; right: 20%; bottom: 24px; border: 2px solid var(--navy); border-radius: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Daily reports</h1>
    <p>Tap a day, write what you worked on, and add photos. Green squares already have a report or photos.</p>
    <nav class="switch">
      <a href="index.html">Hours</a>
      <a class="on" href="reports.html">Daily reports</a>
    </nav>
  </header>
  <div class="bar">
    <div class="chip"><span class="sq">12</span> Day with a report</div>
    <div class="chip">Empty square = nothing written yet</div>
    <div class="chip">Photos stay on this phone</div>
  </div>
  <div class="periods" id="periods"></div>
  <div class="phone" id="appPhone"></div>
  <p class="summary" id="summary"></p>
  <div class="tools">
    <button type="button" id="copyBtn">Copy reports</button>
    <button type="button" id="shareBtn">Share reports</button>
    <button type="button" id="pasteBtn">Paste reports</button>
  </div>
  <textarea id="syncBox" class="sync-box" placeholder="Reports appear here. On the other device: paste, then tap Apply pasted reports."></textarea>
  <div class="tools">
    <button type="button" id="applyBtn">Apply pasted reports</button>
  </div>
  <p class="sync-msg" id="syncMsg" hidden></p>
  <div class="editor" id="editor" hidden>
    <h2 id="edTitle">Report</h2>
    <textarea id="edText" placeholder="What did you work on this day?"></textarea>
    <label class="add-photo">Add photos<input type="file" id="edFiles" accept="image/*" multiple hidden /></label>
    <div class="thumbs" id="edPhotos"></div>
    <div class="row">
      <button type="button" id="edSave">Save report</button>
      <button type="button" id="edClear">Clear</button>
      <button type="button" id="edClose">Close</button>
    </div>
  </div>
  <script>
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const WD = ["Mo","Tu","We","Th","Fr","Sa","Su"];
    const KEY = "koledar-porocila-2026-2027";
    const VIEW_KEY = "koledar-porocila-view";
    const PERIODS = [
      { year: 2026, from: 1, to: 6, label: "2026  jan – jun" },
      { year: 2026, from: 7, to: 12, label: "2026  jul – dec" },
      { year: 2027, from: 1, to: 6, label: "2027  jan – jun" },
      { year: 2027, from: 7, to: 12, label: "2027  jul – dec" },
    ];

    function load(k) {
      try { return localStorage.getItem(k); } catch (e) { return null; }
    }
    function save(k, v) {
      try { localStorage.setItem(k, v); } catch (e) {}
    }
    let data = {};
    try { data = JSON.parse(load(KEY) || "{}") || {}; } catch (e) { data = {}; }
    let view = Math.min(3, Math.max(0, Number(load(VIEW_KEY) ?? 1)));
    let openKey = null;
    let openUrls = [];
    let photoDays = new Set();

    const DB_NAME = "koledar-porocila-photos";
    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore("photos");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function getPhotos(dayKey) {
      try {
        const db = await openDb();
        return await new Promise((resolve, reject) => {
          const r = db.transaction("photos").objectStore("photos").get(dayKey);
          r.onsuccess = () => resolve(Array.isArray(r.result) ? r.result : []);
          r.onerror = () => reject(r.error);
        });
      } catch (e) { return []; }
    }
    async function setPhotos(dayKey, blobs) {
      const db = await openDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readwrite");
        if (blobs.length) tx.objectStore("photos").put(blobs, dayKey);
        else tx.objectStore("photos").delete(dayKey);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
      if (blobs.length) photoDays.add(dayKey); else photoDays.delete(dayKey);
    }
    async function loadPhotoDays() {
      photoDays = new Set();
      try {
        const db = await openDb();
        await new Promise((resolve, reject) => {
          const r = db.transaction("photos").objectStore("photos").openCursor();
          r.onsuccess = () => {
            const c = r.result;
            if (!c) { resolve(); return; }
            if (Array.isArray(c.value) && c.value.length) photoDays.add(c.key);
            c.continue();
          };
          r.onerror = () => reject(r.error);
        });
      } catch (e) {}
    }
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1400;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.width * scale));
          c.height = Math.max(1, Math.round(img.height * scale));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(b => {
            URL.revokeObjectURL(url);
            if (b) resolve(b); else reject(new Error("compress"));
          }, "image/jpeg", 0.72);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
        img.src = url;
      });
    }

    function key(y, m, d) { return `${y}-${m}-${d}`; }
    function noteOf(y, m, d) {
      const t = data[key(y, m, d)];
      return typeof t === "string" ? t : "";
    }
    function dayHas(y, m, d) {
      return !!noteOf(y, m, d).trim() || photoDays.has(key(y, m, d));
    }
    function countMonth(year, month) {
      const last = new Date(year, month, 0).getDate();
      let n = 0;
      for (let d = 1; d <= last; d++) if (dayHas(year, month, d)) n++;
      return n;
    }
    function setView(i) {
      view = (i + PERIODS.length) % PERIODS.length;
      save(VIEW_KEY, String(view));
      render();
    }
    function revokeOpen() {
      openUrls.forEach(u => URL.revokeObjectURL(u));
      openUrls = [];
    }
    async function showPhotos(dayKey) {
      revokeOpen();
      const box = document.getElementById("edPhotos");
      const blobs = await getPhotos(dayKey);
      box.innerHTML = blobs.map((b, i) => {
        const u = URL.createObjectURL(b);
        openUrls.push(u);
        return `<div class="p"><img src="${u}" alt=""><button type="button" class="x" data-i="${i}" aria-label="Remove photo">×</button></div>`;
      }).join("");
      box.querySelectorAll(".x").forEach(btn => {
        btn.addEventListener("click", async () => {
          const next = blobs.filter((_, j) => j !== +btn.dataset.i);
          await setPhotos(dayKey, next);
          showPhotos(dayKey);
          render();
        });
      });
    }
    function openDay(y, m, d) {
      openKey = key(y, m, d);
      const dt = new Date(y, m - 1, d);
      document.getElementById("edTitle").textContent =
        `${WD[(dt.getDay() + 6) % 7]} ${d} ${MONTHS[m - 1]} ${y}`;
      document.getElementById("edText").value = noteOf(y, m, d);
      document.getElementById("editor").hidden = false;
      showPhotos(openKey);
      document.getElementById("edText").focus();
    }
    function closeEditor() {
      document.getElementById("editor").hidden = true;
      revokeOpen();
      openKey = null;
    }
    function saveOpen() {
      if (!openKey) return;
      const text = document.getElementById("edText").value.trim();
      if (text) data[openKey] = document.getElementById("edText").value;
      else delete data[openKey];
      save(KEY, JSON.stringify(data));
      closeEditor();
      render();
    }

    function render() {
      const p = PERIODS[view];
      document.getElementById("periods").innerHTML = PERIODS.map((x, i) =>
        `<button type="button" class="${i===view?"on":""}" data-i="${i}">${x.label}</button>`
      ).join("");

      let phone = "";
      let half = 0;
      for (let m = p.from; m <= p.to; m++) {
        const last = new Date(p.year, m, 0).getDate();
        const n = countMonth(p.year, m);
        half += n;
        const startWd = (new Date(p.year, m - 1, 1).getDay() + 6) % 7;
        phone += `<section class="phone-month"><div class="phone-head">
          <div class="m-name">${MONTHS[m-1]} ${p.year}</div>
          <div class="m-hours">${n} <span>${n === 1 ? "report" : "reports"}</span></div>
        </div><div class="phone-grid">`;
        WD.forEach(w => { phone += `<div class="wd${w==="Sa"||w==="Su"?" weekend":""}">${w}</div>`; });
        for (let i = 0; i < startWd; i++) phone += `<div class="day empty"></div>`;
        for (let d = 1; d <= last; d++) {
          const wd = (new Date(p.year, m - 1, d).getDay() + 6) % 7;
          const k = key(p.year, m, d);
          const note = !!noteOf(p.year, m, d).trim();
          const pic = photoDays.has(k);
          const has = note || pic;
          const mark = note && pic ? "note+" : pic ? "photo" : note ? "note" : "";
          const wk = wd >= 5 ? " weekend" : "";
          phone += `<div class="day${has?" has":""}${wk}" data-y="${p.year}" data-m="${m}" data-d="${d}"><span class="n">${d}</span>${mark ? `<span class="st">${mark}</span>` : ""}</div>`;
        }
        phone += `</div></section>`;
      }
      document.getElementById("appPhone").innerHTML = phone;

      let y26 = 0, y27 = 0;
      for (let m = 1; m <= 12; m++) {
        y26 += countMonth(2026, m);
        y27 += countMonth(2027, m);
      }
      document.getElementById("summary").innerHTML =
        `This period: <b>${half}</b> reports · 2026: <b>${y26}</b> · 2027: <b>${y27}</b>`;

      document.querySelectorAll("#periods button").forEach(el => {
        el.addEventListener("click", () => setView(+el.dataset.i));
      });
      document.querySelectorAll(".day[data-y]").forEach(el => {
        el.addEventListener("click", () => openDay(+el.dataset.y, +el.dataset.m, +el.dataset.d));
      });
    }

    function backupText() { return JSON.stringify(data, null, 2); }
    function say(msg) {
      const el = document.getElementById("syncMsg");
      el.hidden = false;
      el.textContent = msg;
    }
    function applyReports(raw) {
      const next = JSON.parse(String(raw));
      if (!next || typeof next !== "object" || Array.isArray(next)) throw new Error("bad");
      data = next;
      save(KEY, JSON.stringify(data));
      render();
      say("Reports updated on this device.");
    }
    async function copyReports() {
      const text = backupText();
      document.getElementById("syncBox").value = text;
      try {
        await navigator.clipboard.writeText(text);
        say("Copied. On the other device: Paste reports, then Apply pasted reports.");
      } catch (e) {
        document.getElementById("syncBox").select();
        say("Select the text below and copy it, then paste on the other device.");
      }
    }

    document.getElementById("copyBtn").addEventListener("click", () => { copyReports(); });
    document.getElementById("shareBtn").addEventListener("click", async () => {
      const text = backupText();
      document.getElementById("syncBox").value = text;
      try {
        if (navigator.share) {
          await navigator.share({ text, title: "Daily reports" });
          say("Shared. On the other device: Paste reports, then Apply.");
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
      copyReports();
    });
    document.getElementById("pasteBtn").addEventListener("click", async () => {
      try {
        applyReports(await navigator.clipboard.readText());
      } catch (e) {
        say("Paste into the box below, then tap Apply pasted reports.");
        document.getElementById("syncBox").focus();
      }
    });
    document.getElementById("applyBtn").addEventListener("click", () => {
      try { applyReports(document.getElementById("syncBox").value); }
      catch (e) { say("That text is not a reports backup."); }
    });
    document.getElementById("edSave").addEventListener("click", saveOpen);
    document.getElementById("edClear").addEventListener("click", () => {
      document.getElementById("edText").value = "";
      saveOpen();
    });
    document.getElementById("edClose").addEventListener("click", closeEditor);
    document.getElementById("edFiles").addEventListener("change", async ev => {
      const files = [...(ev.target.files || [])];
      ev.target.value = "";
      if (!openKey || !files.length) return;
      const have = await getPhotos(openKey);
      for (const file of files) {
        if (have.length >= 8) { say("Maximum 8 photos per day."); break; }
        try { have.push(await compressImage(file)); }
        catch (e) { say("Could not add that photo."); }
      }
      await setPhotos(openKey, have);
      showPhotos(openKey);
      render();
    });
    loadPhotoDays().then(render);
  </script>
</body>
</html>
